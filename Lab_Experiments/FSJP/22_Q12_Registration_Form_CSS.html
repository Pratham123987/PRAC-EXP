<!DOCTYPE html>
<html>
<head>
 <title>Student Registration</title>
 <style>
  body { font-family: Arial, sans-serif; background: #f2f2f2; }
  .form-box { width: 350px; margin: 40px auto; padding: 20px; background: white;
              border-radius: 8px; box-shadow: 0 0 8px gray; }
  h2 { text-align: center; }
  input, select { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
  button { width: 100%; padding: 10px; background: green; color: white; border: none; cursor: pointer; }
 </style>
</head>
<body>
 <div class="form-box">
  <h2>Student Registration</h2>
  <form>
   <label>Name</label><input type="text" placeholder="Enter name">
   <label>Email</label><input type="email" placeholder="Enter email">
   <label>Password</label><input type="password" placeholder="Enter password">
   <label>Course</label>
   <select><option>B.Tech</option><option>BCA</option><option>MCA</option></select>
   <button type="submit">Register</button>
  </form>
 </div>
</body>
</html>
